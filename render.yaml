# Blueprint Render : hébergement du backend (API FastAPI).
# Le frontend Next.js est hébergé sur Vercel (voir docs/05-deploiement.md).
services:
  - type: web
    name: ecoenergy-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Base SQLite emballée en texte (app/pipeline/pack_db.py), collée dans « Secret Files »
      # sous le nom ecoenergy.db.gz.b64 — jamais dans Git
      - key: ECOENERGY_DB_PACKED
        value: /etc/secrets/ecoenergy.db.gz.b64
      # Clé partagée avec Vercel (BACKEND_API_KEY) : à saisir dans le tableau de bord Render
      - key: ECOENERGY_API_KEY
        sync: false
